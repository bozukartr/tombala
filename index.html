<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Aynı masanın etrafında, nerede olursanız olun. 2–4 kişilik çevrimiçi aile tombalası; istersen botlarla tek başına.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tombala">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="styles.css">
<script>try{const t=JSON.parse(localStorage.getItem('tombala-settings')||'{}').theme;if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch{}</script>
<title>Tombala · Birlikte güzel</title>
</head>
<body data-screen="home">
<div class="app-shell">
<header id="topbar" class="topbar"></header>
<main id="app" tabindex="-1"></main>
<div id="action-dock" class="action-dock"></div>
</div>
<div id="celebration" class="celebration" role="status" aria-live="polite" hidden></div>
<div id="reaction-layer" class="reaction-layer" aria-hidden="true"></div>
<div id="countdown" class="countdown" aria-live="assertive" hidden></div>
<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
<p id="announcer" class="visually-hidden" aria-live="polite"></p>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title" autofocus tabindex="-1"></dialog>
<noscript>Bu oyunu oynamak için tarayıcında JavaScript'i etkinleştir.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
